<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1420" viewBox="0 0 1700 1420" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de clases del dominio académico</title>
  <desc id="desc">Modelo de dominio del portal con RBAC, auditoría, asistencia, bitácoras, referencias de Classroom y valoraciones formativas locales.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#111}
      .heading{font-size:28px;font-weight:700}
      .subheading{font-size:15px;fill:#444}
      .class-box{fill:#fff;stroke:#222;stroke-width:2}
      .class-name{font-size:17px;font-weight:700;text-anchor:middle}
      .field{font-size:13px}
      .method{font-size:13px;font-style:italic}
      .divider{stroke:#444;stroke-width:1}
      .relation{fill:none;stroke:#333;stroke-width:1.6}
      .rel-label{font-size:12px;fill:#333}
      .multiplicity{font-size:12px;font-weight:700}
    </style>
  </defs>
  <rect width="1700" height="1420" fill="#fff"/>
  <text class="heading" x="850" y="42" text-anchor="middle">Diagrama de Clases del Dominio</text>
  <text class="subheading" x="850" y="68" text-anchor="middle">Classroom aporta tareas y estados oficiales como datos externos de solo lectura; sus entregas/archivos no se guardan en este portal.</text>

  <g class="relation">
    <path d="M300 315V220H800V175"/>
    <path d="M960 135H1050"/>
    <path d="M800 315V175"/>
    <path d="M800 425V470H640V505"/>
    <path d="M800 470H1110V505"/>
    <path d="M640 615V675H810V710"/>
    <path d="M1390 365V655H990V710"/>
    <path d="M1390 615V665H990V710"/>
    <path d="M300 425V710"/>
    <path d="M1110 615V660H460V710"/>
    <path d="M1000 770H1120"/>
    <path d="M1300 810V850"/>
    <path d="M480 370H520V995H455V1035"/>
    <path d="M1300 975V1000H650V1100H630"/>
    <path d="M480 400H520V1010H890V1035"/>
    <path d="M890 830V1035"/>
    <path d="M120 370H65V1210H545V1230"/>
    <path d="M120 390H80V1218H1015V1230"/>
    <path d="M480 350H560V455H1580V315H1530"/>
    <path d="M1530 160H1640V1285H1640"/>
  </g>
  <g>
    <text class="multiplicity" x="310" y="305">1</text><text class="multiplicity" x="310" y="445">0..*</text>
    <text class="rel-label" x="315" y="610">registra</text>
    <text class="multiplicity" x="785" y="195">1</text><text class="multiplicity" x="785" y="305">0..1</text>
    <text class="rel-label" x="818" y="245">herencia</text>
    <text class="multiplicity" x="972" y="127">1</text><text class="multiplicity" x="1035" y="127">0..1</text>
    <text class="multiplicity" x="650" y="660">1</text><text class="multiplicity" x="650" y="695">0..*</text>
    <text class="rel-label" x="662" y="650">asigna</text>
    <text class="multiplicity" x="1365" y="390">1</text><text class="multiplicity" x="1005" y="695">0..*</text>
    <text class="multiplicity" x="1010" y="760">1</text><text class="multiplicity" x="1105" y="760">0..*</text>
    <text class="rel-label" x="1030" y="745">registra</text>
    <text class="multiplicity" x="1310" y="830">1</text><text class="multiplicity" x="1310" y="870">0..*</text>
    <text class="rel-label" x="1320" y="847">contiene</text>
    <text class="multiplicity" x="430" y="1020">1</text><text class="multiplicity" x="435" y="1185">0..*</text>
    <text class="rel-label" x="465" y="1018">consulta</text>
    <text class="multiplicity" x="492" y="340">0..*</text><text class="multiplicity" x="1500" y="307">1</text>
    <text class="multiplicity" x="1510" y="180">1</text><text class="multiplicity" x="1620" y="1270">0..*</text>
    <text class="multiplicity" x="1270" y="985">1</text><text class="multiplicity" x="655" y="1088">0..1</text>
    <text class="rel-label" x="1060" y="992">estado propio consultado</text>
    <text class="multiplicity" x="495" y="390">1</text><text class="multiplicity" x="870" y="1025">0..*</text>
    <text class="rel-label" x="540" y="1000">recibe valoración</text>
  </g>

  <g>
    <rect class="class-box" x="640" y="95" width="320" height="80" rx="4"/>
    <text class="class-name" x="800" y="120">Persona</text><line class="divider" x1="640" y1="132" x2="960" y2="132"/>
    <text class="field" x="652" y="151">PK idPersona · DNI · nombres · apellidos · email</text>

    <rect class="class-box" x="1050" y="95" width="480" height="130" rx="4"/>
    <text class="class-name" x="1290" y="120">CuentaAcceso</text><line class="divider" x1="1050" y1="132" x2="1530" y2="132"/>
    <text class="field" x="1062" y="151">PK idCuenta · FK idPersona · identificador institucional</text>
    <text class="field" x="1062" y="170">hashContraseña · activo · rolesSistema (RBAC)</text>
    <text class="method" x="1062" y="199">+ autenticar() · + verificarPermiso(accion)</text>

    <rect class="class-box" x="120" y="315" width="360" height="110" rx="4"/>
    <text class="class-name" x="300" y="340">Estudiante</text><line class="divider" x1="120" y1="352" x2="480" y2="352"/>
    <text class="field" x="132" y="371">PK/FK idPersona · FK idCurso · legajo</text>
    <text class="field" x="132" y="390">estadoRegularidad · acumuladoFaltas</text>
    <text class="method" x="132" y="410">+ consultarRegularidad() · + consultarValoraciones()</text>

    <rect class="class-box" x="640" y="315" width="320" height="110" rx="4"/>
    <text class="class-name" x="800" y="340">Empleado</text><line class="divider" x1="640" y1="352" x2="960" y2="352"/>
    <text class="field" x="652" y="371">PK/FK idPersona · CUIL · activo</text>

    <rect class="class-box" x="1250" y="265" width="280" height="100" rx="4"/>
    <text class="class-name" x="1390" y="290">Curso</text><line class="divider" x1="1250" y1="302" x2="1530" y2="302"/>
    <text class="field" x="1262" y="321">PK idCurso · año · división · turno</text>
    <text class="method" x="1262" y="347">+ obtenerEstudiantes()</text>

    <rect class="class-box" x="500" y="505" width="280" height="110" rx="4"/>
    <text class="class-name" x="640" y="530">Docente</text><line class="divider" x1="500" y1="542" x2="780" y2="542"/>
    <text class="field" x="512" y="561">PK/FK idPersona · título</text>
    <text class="method" x="512" y="590">+ publicarBitacora() · + valorarProceso()</text>

    <rect class="class-box" x="970" y="505" width="280" height="140" rx="4"/>
    <text class="class-name" x="1110" y="530">Preceptor</text><line class="divider" x1="970" y1="542" x2="1250" y2="542"/>
    <text class="field" x="982" y="561">PK/FK idPersona · turno</text>
    <text class="method" x="982" y="586">+ registrarAsistencia() · + rectificar()</text>
    <text class="method" x="982" y="606">+ gestionarAlertas() · + gestionarActas()</text>
    <text class="method" x="982" y="626">+ filtrarAusentes(curso, fecha)</text>

    <rect class="class-box" x="1250" y="505" width="280" height="110" rx="4"/>
    <text class="class-name" x="1390" y="530">EspacioCurricular</text><line class="divider" x1="1250" y1="542" x2="1530" y2="542"/>
    <text class="field" x="1262" y="561">PK idEspacio · nombre · nivel · ciclo</text>
    <text class="method" x="1262" y="590">+ listarBitacoras()</text>

    <rect class="class-box" x="620" y="710" width="380" height="120" rx="4"/>
    <text class="class-name" x="810" y="735">AsignacionDocente</text><line class="divider" x1="620" y1="747" x2="1000" y2="747"/>
    <text class="field" x="632" y="766">PK idAsignacion · FK idDocente · FK idCurso</text>
    <text class="field" x="632" y="785">FK idEspacio · cicloLectivo · activo</text>
    <text class="method" x="632" y="812">+ validarAsignacion()</text>

    <rect class="class-box" x="1120" y="685" width="360" height="125" rx="4"/>
    <text class="class-name" x="1300" y="710">Bitacora</text><line class="divider" x1="1120" y1="722" x2="1480" y2="722"/>
    <text class="field" x="1132" y="741">PK idBitacora · FK idAsignacion · fecha</text>
    <text class="field" x="1132" y="760">tema · descripción · recursos · publicadaEn</text>
    <text class="method" x="1132" y="792">+ publicar() · + validarEnlaces()</text>

    <rect class="class-box" x="100" y="710" width="360" height="140" rx="4"/>
    <text class="class-name" x="280" y="735">Asistencia</text><line class="divider" x1="100" y1="747" x2="460" y2="747"/>
    <text class="field" x="112" y="766">PK idAsistencia · FK idEstudiante</text>
    <text class="field" x="112" y="785">FK idCurso · FK idPreceptor · fecha</text>
    <text class="field" x="112" y="804">estado · minutosTarde · fracción · justificada</text>
    <text class="method" x="112" y="832">+ calcularFraccion() · + rectificar()</text>
    <text class="method" x="112" y="848">UNIQUE(idEstudiante, idCurso, fecha, turno)</text>

    <rect class="class-box" x="1120" y="850" width="360" height="125" rx="4"/>
    <text class="class-name" x="1300" y="875">ReferenciaClassroom</text><line class="divider" x1="1120" y1="887" x2="1480" y2="887"/>
    <text class="field" x="1132" y="906">courseId · courseWorkId · título · fechaLímite</text>
    <text class="field" x="1132" y="925">alternateLink · consultadoEn · origen = Classroom</text>
    <text class="method" x="1132" y="957">+ abrirEnClassroom() · solo lectura</text>

    <rect class="class-box" x="280" y="1035" width="350" height="130" rx="4"/>
    <text class="class-name" x="455" y="1060">VistaEntregaClassroom</text><line class="divider" x1="280" y1="1072" x2="630" y2="1072"/>
    <text class="field" x="292" y="1091">courseWorkId · submissionId · estado · late</text>
    <text class="field" x="292" y="1110">assignedGrade · alternateLink · consultadoEn</text>
    <text class="method" x="292" y="1144">«vista API» consultar solo datos propios</text>

    <rect class="class-box" x="700" y="1035" width="380" height="130" rx="4"/>
    <text class="class-name" x="890" y="1060">ValoracionFormativa</text><line class="divider" x1="700" y1="1072" x2="1080" y2="1072"/>
    <text class="field" x="712" y="1091">PK idValoración · FK idEstudiante · FK idDocente</text>
    <text class="field" x="712" y="1110">valor cuantitativo/cualitativo · fecha · feedback</text>
    <text class="method" x="712" y="1144">+ validarFeedback() · local, no es nota oficial</text>

    <rect class="class-box" x="360" y="1230" width="370" height="130" rx="4"/>
    <text class="class-name" x="545" y="1255">AlertaRegularidad</text><line class="divider" x1="360" y1="1267" x2="730" y2="1267"/>
    <text class="field" x="372" y="1286">PK idAlerta · FK idEstudiante · umbral · fecha</text>
    <text class="field" x="372" y="1305">tipo · estado · FK idUsuarioEmisor</text>
    <text class="method" x="372" y="1334">+ generarAlerta() · + generarActa()</text>

    <rect class="class-box" x="830" y="1230" width="370" height="130" rx="4"/>
    <text class="class-name" x="1015" y="1255">FichaTEA</text><line class="divider" x1="830" y1="1267" x2="1200" y2="1267"/>
    <text class="field" x="842" y="1286">PK idFicha · FK idEstudiante · fecha · estado</text>
    <text class="field" x="842" y="1305">antecedentes · FK idUsuarioEmisor</text>
    <text class="method" x="842" y="1334">+ emitir() · + registrarIntervencion()</text>

    <rect class="class-box" x="1260" y="1210" width="380" height="150" rx="4"/>
    <text class="class-name" x="1450" y="1235">EventoAuditoria</text><line class="divider" x1="1260" y1="1247" x2="1640" y2="1247"/>
    <text class="field" x="1272" y="1266">PK idEvento · FK idCuentaActor</text>
    <text class="field" x="1272" y="1285">entidad · idEntidad · acción · fechaHora</text>
    <text class="field" x="1272" y="1304">motivo · valorAnterior · valorNuevo</text>
    <text class="method" x="1272" y="1334">+ registrarCambio()</text>
  </g>
</svg>