        <svg id="componentsDiagramSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100">
          <defs>
            <marker id="compArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" />
            </marker>
          </defs>

          <!-- Título del diagrama -->
          <text x="600" y="45" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#000000" text-anchor="middle">Diagrama de Componentes - Sistema Escolar ProA La Falda</text>

          <!-- Capa 1: Presentación / Clientes -->
          <g transform="translate(180, 100)">
            <rect x="0" y="0" width="340" height="75" fill="#ffffff" stroke="#000000" stroke-width="1.8" rx="8" />
            <text x="170" y="33" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#000000" text-anchor="middle">Interfaz Web Móvil (PWA)</text>
            <text x="170" y="53" font-family="'Inter', sans-serif" font-size="13" fill="#000000" text-anchor="middle">(Preceptoría en Pasillos)</text>
          </g>

          <g transform="translate(680, 100)">
            <rect x="0" y="0" width="340" height="75" fill="#ffffff" stroke="#000000" stroke-width="1.8" rx="8" />
            <text x="170" y="33" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#000000" text-anchor="middle">Panel de Administración</text>
            <text x="170" y="53" font-family="'Inter', sans-serif" font-size="13" fill="#000000" text-anchor="middle">(Dirección / Coordinación)</text>
          </g>

          <!-- Conexión HTTP/JSON hacia Capa de Servicios -->
          <line x1="350" y1="175" x2="350" y2="290" stroke="#000000" stroke-width="1.8" marker-end="url(#compArrow)" />
          <rect x="300" y="218" width="100" height="20" fill="#ffffff" />
          <text x="350" y="233" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="middle">HTTPS / JSON</text>

          <line x1="850" y1="175" x2="850" y2="290" stroke="#000000" stroke-width="1.8" marker-end="url(#compArrow)" />
          <rect x="800" y="218" width="100" height="20" fill="#ffffff" />
          <text x="850" y="233" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="middle">HTTPS / JSON</text>

          <!-- Capa 2: Servicios de Lógica de Negocio -->
          <g transform="translate(100, 290)">
            <rect x="0" y="0" width="300" height="75" fill="#ffffff" stroke="#000000" stroke-width="1.8" rx="8" />
            <text x="150" y="43" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#000000" text-anchor="middle">Servicio Asistencia</text>
          </g>

          <g transform="translate(450, 290)">
            <rect x="0" y="0" width="300" height="75" fill="#ffffff" stroke="#000000" stroke-width="1.8" rx="8" />
            <text x="150" y="43" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#000000" text-anchor="middle">Servicio Bitácora</text>
          </g>

          <g transform="translate(800, 290)">
            <rect x="0" y="0" width="300" height="75" fill="#ffffff" stroke="#000000" stroke-width="1.8" rx="8" />
            <text x="150" y="43" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#000000" text-anchor="middle">Servicio Notas</text>
          </g>

          <!-- Conexiones internas de servicios hacia Motor de Reglas y Módulo SGE -->
          <line x1="250" y1="365" x2="415" y2="460" stroke="#000000" stroke-width="1.8" marker-end="url(#compArrow)" />
          <line x1="600" y1="365" x2="415" y2="460" stroke="#000000" stroke-width="1.8" marker-end="url(#compArrow)" />
          <line x1="600" y1="365" x2="785" y2="460" stroke="#000000" stroke-width="1.8" marker-end="url(#compArrow)" />

          <!-- Componentes de Procesamiento / Negocio -->
          <g transform="translate(250, 460)">
            <rect x="0" y="0" width="330" height="75" fill="#ffffff" stroke="#000000" stroke-width="1.8" rx="8" />
            <text x="165" y="33" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#000000" text-anchor="middle">Motor de Reglas</text>
            <text x="165" y="53" font-family="'Inter', sans-serif" font-size="13" fill="#000000" text-anchor="middle">(TEA / Alertas)</text>
          </g>

          <g transform="translate(620, 460)">
            <rect x="0" y="0" width="330" height="75" fill="#ffffff" stroke="#000000" stroke-width="1.8" rx="8" />
            <text x="165" y="33" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#000000" text-anchor="middle">Módulo de Exportación SGE</text>
            <text x="165" y="53" font-family="'Inter', sans-serif" font-size="13" fill="#000000" text-anchor="middle">(Sistema de Gestión Escolar)</text>
          </g>

          <!-- Conexión hacia Base de Datos -->
          <line x1="415" y1="535" x2="600" y2="650" stroke="#000000" stroke-width="1.8" marker-end="url(#compArrow)" />
          <rect x="450" y="578" width="95" height="20" fill="#ffffff" />
          <text x="497" y="593" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#000000" text-anchor="middle">ORM / JDBC</text>

          <!-- Cylinder SVG shape para Base de Datos -->
          <g transform="translate(360, 650)">
            <path d="M 0 25 L 0 110 A 240 25 0 0 0 480 110 L 480 25 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
            <ellipse cx="240" cy="25" rx="240" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
            <ellipse cx="240" cy="110" rx="240" ry="25" fill="none" stroke="#000000" stroke-width="1.8" />
            <text x="240" y="52" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#000000" text-anchor="middle">Base de Datos Relacional</text>
            <text x="240" y="72" font-family="'Inter', sans-serif" font-size="13" fill="#000000" text-anchor="middle">(PostgreSQL / MySQL)</text>
            <text x="240" y="92" font-family="'Fira Code', monospace" font-size="11" fill="#000000" text-anchor="middle">Tablas: Personas, Asistencias, Bitácoras, Calificaciones</text>
          </g>
        </svg>
