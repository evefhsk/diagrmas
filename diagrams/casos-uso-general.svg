<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama general de casos de uso</title>
  <desc id="desc">Actores y funciones principales del Sistema Web de Autogestion Academica y Seguimiento Pedagogico.</desc>
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#000000!important}.heading{font-size:28px;font-weight:700}.subheading{font-size:16px;fill:#000000}.system{fill:#ffffff;stroke:#000000;stroke-width:2}.usecase{fill:#ffffff;stroke:#000000;stroke-width:2}.case-label{font-size:17px;font-weight:600;text-anchor:middle}.case-id{font-size:13px;font-weight:700;fill:#000000;text-anchor:middle}.actor-line{fill:none;stroke:#000000;stroke-width:2}.assoc{fill:none;stroke:#000000;stroke-width:1.6}.actor-name{font-size:16px;font-weight:600;text-anchor:middle}.note{font-size:14px;fill:#000000}.note-box{fill:#ffffff;stroke:#000000;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1800" height="1040" fill="#fff"/>
  <text class="heading" x="900" y="46" text-anchor="middle">Sistema Web de Autogestión Académica y Seguimiento Pedagógico</text>
  <text class="subheading" x="900" y="74" text-anchor="middle">Diagrama general de casos de uso · alcance funcional documentado</text>

  <rect class="system" x="300" y="110" width="1200" height="800" rx="8"/>
  <text x="330" y="145" font-size="16" font-weight="700">Sistema Web</text>
