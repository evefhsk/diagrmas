    <text class="actor-name" x="0" y="130">Docente</text>
  </g>
  <g transform="translate(150 500)">
    <circle class="actor-line" cx="0" cy="0" r="18"/><path class="actor-line" d="M0 18V68M-28 38H28M0 68L-24 104M0 68L24 104"/>
