<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama general de casos de uso</title>
  <desc id="desc">Actores y funciones principales del Sistema Web de Autogestion Academica y Seguimiento Pedagogico.</desc>
  <defs>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#000000!important}.heading{font-size:28px;font-weight:700}.subheading{font-size:16px;fill:#000000}.system{fill:#ffffff;stroke:#000000;stroke-width:2}.usecase{fill:#ffffff;stroke:#000000;stroke-width:2}.case-label{font-size:17px;font-weight:600;text-anchor:middle}.case-id{font-size:13px;font-weight:700;fill:#000000;text-anchor:middle}.actor-line{fill:none;stroke:#000000;stroke-width:2}.assoc{fill:none;stroke:#000000;stroke-width:1.6}.actor-name{font-size:16px;font-weight:600;text-anchor:middle}.note{font-size:14px;fill:#000000}.note-box{fill:#ffffff;stroke:#000000;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1800" height="1040" fill="#fff"/>
  <text class="heading" x="900" y="46" text-anchor="middle">Sistema Web de Autogestión Académica y Seguimiento Pedagógico</text>
  <text class="subheading" x="900" y="74" text-anchor="middle">Diagrama general de casos de uso · alcance funcional documentado</text>

  <rect class="system" x="300" y="110" width="1200" height="660" rx="8"/>
  <text x="330" y="145" font-size="16" font-weight="700">Sistema Web</text>
  <g class="assoc">
    <path d="M178 273L435 205"/><path d="M178 273H260V535H435"/>
    <path d="M1622 273L1375 205"/><path d="M1622 273H1545V535H1375"/>
    <path d="M178 538L435 370"/><path d="M178 538L435 700"/>
    <path d="M1622 448L1395 370"/><path d="M1622 688H1470V370H1395"/>
    <path d="M1622 688L1390 700"/><path d="M1622 688H1550V770H800V535"/>
  </g>

  <g>
    <ellipse class="usecase" cx="610" cy="205" rx="175" ry="46"/>
    <text class="case-id" x="610" y="195">CU-01</text><text class="case-label" x="610" y="220">Asistencia y tardanzas</text>
    <ellipse class="usecase" cx="1190" cy="205" rx="185" ry="46"/>
    <text class="case-id" x="1190" y="195">CU-02 · RF-05</text><text class="case-label" x="1190" y="220">Publicar bitácora</text>
    <ellipse class="usecase" cx="610" cy="370" rx="175" ry="46"/>
    <text class="case-id" x="610" y="360">CU-03 · RF-06</text><text class="case-label" x="610" y="385">Consultar clases y actividades</text>
    <ellipse class="usecase" cx="1190" cy="370" rx="200" ry="46"/>
    <text class="case-id" x="1190" y="360">CU-04</text><text class="case-label" x="1190" y="385">Supervisar avance y regularidad</text>
    <ellipse class="usecase" cx="610" cy="535" rx="190" ry="46"/>
    <text class="case-id" x="610" y="525">RF-03</text><text class="case-label" x="610" y="550">Revisar alertas y gestionar actas</text>
    <ellipse class="usecase" cx="1190" cy="535" rx="185" ry="46"/>
    <text class="case-id" x="1190" y="525">RF-07</text><text class="case-label" x="1190" y="550">Registrar calificaciones</text>
    <ellipse class="usecase" cx="610" cy="700" rx="185" ry="46"/>
    <text class="case-id" x="610" y="690">RF-07</text><text class="case-label" x="610" y="715">Consultar calificaciones</text>
    <ellipse class="usecase" cx="1190" cy="700" rx="200" ry="46"/>
    <text class="case-id" x="1190" y="690">RF-08</text><text class="case-label" x="1190" y="715">Generar reporte para SGE/CiDi</text>
  </g>

  <g transform="translate(150 235)">
    <circle class="actor-line" cx="0" cy="0" r="18"/><path class="actor-line" d="M0 18V68M-28 38H28M0 68L-24 104M0 68L24 104"/>
    <text class="actor-name" x="0" y="130">Preceptoría</text>
  </g>
  <g transform="translate(1650 235)">
    <circle class="actor-line" cx="0" cy="0" r="18"/><path class="actor-line" d="M0 18V68M-28 38H28M0 68L-24 104M0 68L24 104"/>
    <text class="actor-name" x="0" y="130">Docente</text>
  </g>
  <g transform="translate(150 500)">
    <circle class="actor-line" cx="0" cy="0" r="18"/><path class="actor-line" d="M0 18V68M-28 38H28M0 68L-24 104M0 68L24 104"/>
    <text class="actor-name" x="0" y="130">Estudiante</text>
  </g>
  <g transform="translate(1650 410)">
    <circle class="actor-line" cx="0" cy="0" r="18"/><path class="actor-line" d="M0 18V68M-28 38H28M0 68L-24 104M0 68L24 104"/>
    <text class="actor-name" x="0" y="130">Coordinación</text><text class="actor-name" x="0" y="151">Pedagógica</text>
  </g>
  <g transform="translate(1650 650)">
    <circle class="actor-line" cx="0" cy="0" r="18"/><path class="actor-line" d="M0 18V68M-28 38H28M0 68L-24 104M0 68L24 104"/>
    <text class="actor-name" x="0" y="130">Dirección</text>
  </g>

  <rect class="note-box" x="330" y="785" width="1120" height="120" rx="5"/>
  <text class="note" x="348" y="811">RF-03: el sistema alerta en 3, 5, 10 y 20 faltas; Preceptoría revisa el aviso y gestiona el acta precompletada en 10/20.</text>
  <text class="note" x="348" y="837">Dirección recibe las alertas y participa de la firma presencial del acta; a 25 faltas, el sistema notifica a Coordinación por TEA.</text>
  <text class="note" x="348" y="863">RF-07: el docente registra y el estudiante consulta calificaciones. RF-08: reporte SGE/CiDi sujeto a permisos RBAC.</text>
</svg>
