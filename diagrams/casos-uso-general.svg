    <text class="case-id" x="1190" y="418">CU-04</text><text class="case-label" x="1190" y="444">Auditar avance pedagógico y regularidad</text>
    <ellipse class="usecase" cx="1190" cy="610" rx="185" ry="54"/>
    <text class="case-id" x="1190" y="600">RF-07</text><text class="case-label" x="1190" y="625">Registrar calificaciones</text>
    <ellipse class="usecase" cx="610" cy="610" rx="185" ry="54"/>
    <text class="case-id" x="610" y="600">RF-07</text><text class="case-label" x="610" y="625">Consultar calificaciones</text>
  </g>

