  <rect class="note-box" x="330" y="800" width="1120" height="72" rx="5"/>
  <text class="note" x="348" y="828">RF-08 exige reportes para carga manual en SGE/CiDi; el documento no identifica quién inicia esa función.</text>
  <text class="note" x="348" y="852">Tutores y familias no tienen acceso web en esta etapa. RF-07 sí especifica registro docente y consulta estudiantil.</text>
