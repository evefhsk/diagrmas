    <path d="M1622 688H1540V596H800V581"/>
    <path d="M178 273H260V700H990"/>
    <path d="M178 538H260V820H420"/><path d="M1622 273H1570V900H800V866"/>
    <path d="M1622 273H1520V774H1190"/><path d="M1822 878H1700V820H1390"/>
  </g>

  <g>
    <ellipse class="usecase" cx="610" cy="205" rx="175" ry="46"/>
    <text class="case-id" x="610" y="195">CU-01</text><text class="case-label" x="610" y="220">Asistencia y tardanzas</text>
    <ellipse class="usecase" cx="1190" cy="205" rx="185" ry="46"/>
    <text class="case-id" x="1190" y="195">CU-02 · RF-05</text><text class="case-label" x="1190" y="220">Publicar bitácora</text>
    <ellipse class="usecase" cx="610" cy="370" rx="175" ry="46"/>
    <text class="case-id" x="610" y="360">CU-03 · RF-06</text><text class="case-label" x="610" y="385">Consultar clases y actividades</text>
    <ellipse class="usecase" cx="1190" cy="370" rx="200" ry="46"/>
    <text class="case-id" x="1190" y="360">CU-04</text><text class="case-label" x="1190" y="385">Supervisar avance y regularidad</text>
    <ellipse class="usecase" cx="610" cy="535" rx="190" ry="46"/>
    <text class="case-id" x="610" y="525">RF-03</text><text class="case-label" x="610" y="550">Revisar alertas y gestionar actas</text>
    <ellipse class="usecase" cx="1190" cy="535" rx="185" ry="46"/>
    <text class="case-id" x="1190" y="525">RF-07</text><text class="case-label" x="1190" y="550">Registrar valoración formativa local</text>
    <ellipse class="usecase" cx="610" cy="700" rx="185" ry="46"/>
    <text class="case-id" x="610" y="690">RF-07</text><text class="case-label" x="610" y="715">Consultar valoración formativa</text>
    <ellipse class="usecase" cx="1190" cy="700" rx="200" ry="46"/>
    <text class="case-id" x="1190" y="690">RF-08</text><text class="case-label" x="1190" y="715">Filtrar ausentes para carga manual</text>
    <ellipse class="usecase" cx="610" cy="820" rx="190" ry="46"/>
    <text class="case-id" x="610" y="810">CU-05 / RF-09 · propuesta</text><text class="case-label" x="610" y="835">Plantear y responder dudas</text>
    <ellipse class="usecase" cx="1190" cy="820" rx="200" ry="46"/>
    <text class="case-id" x="1190" y="808">RF-10 · propuesta</text><text class="case-label" x="1190" y="833">Consultar tareas y abrir Classroom</text>
  </g>

