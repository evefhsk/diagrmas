    <text class="case-id" x="610" y="240">CU-01</text><text class="case-label" x="610" y="265">Registrar asistencia diaria y tardanzas</text>
    <ellipse class="usecase" cx="1190" cy="250" rx="180" ry="54"/>
    <text class="case-id" x="1190" y="240">CU-02</text><text class="case-label" x="1190" y="265">Registrar bitácora de clase</text>
    <ellipse class="usecase" cx="610" cy="430" rx="165" ry="54"/>
