  </g>
  <g transform="translate(1850 840)">
    <circle class="actor-line" cx="0" cy="0" r="18"/><path class="actor-line" d="M0 18V68M-28 38H28M0 68L-24 104M0 68L24 104"/>
    <text class="actor-name" x="0" y="130">Google Classroom</text>
    <text class="actor-name" x="0" y="150">(sistema externo)</text>
  </g>

  <rect class="note-box" x="330" y="930" width="1340" height="125" rx="5"/>
  <text class="note" x="348" y="957">RF-03: alertas en 3, 5, 10 y 20 faltas; actas precompletadas en 10/20. A 25, el sistema notifica a Coordinación por TEA.</text>
  <text class="note" x="348" y="984">RF-07: registro docente y consulta estudiantil. RF-08: filtro de ausentes para carga manual; no hay envío automático a SGE/CiDi.</text>
  <text class="note" x="348" y="1011">RF-09 usa mensajería propia; RF-10 es lectura/enlace: Classroom conserva tareas, entregas y notas oficiales.</text>
</svg>
