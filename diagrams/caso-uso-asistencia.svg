<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">CU-01 Registrar asistencia y gestionar alertas de regularidad</title>
  <desc id="desc">Preceptoría registra asistencia, tardanzas y rectificaciones, revisa alertas automáticas y gestiona actas precompletadas.</desc>
  <defs><style>text{font-family:Inter,Arial,sans-serif;fill:#000}.heading{font-size:26px;font-weight:700}.subheading{font-size:15px}.system,.usecase,.maincase{fill:#fff;stroke:#000;stroke-width:2}.label{font-size:16px;font-weight:600;text-anchor:middle}.actor-line{fill:none;stroke:#000;stroke-width:2}.actor-name{font-size:17px;font-weight:600;text-anchor:middle}.note{font-size:14px}</style></defs>
  <rect width="1400" height="1000" fill="#fff"/>
  <text class="heading" x="700" y="45" text-anchor="middle">CU-01 · Registrar asistencia y gestionar alertas</text>
  <text class="subheading" x="700" y="72" text-anchor="middle">Actor principal: Preceptoría · Dirección: seguimiento de alertas/actas · precondición: sesión y turno activos</text>
  <rect class="system" x="300" y="105" width="1010" height="820" rx="8"/><text x="325" y="138" font-size="15" font-weight="700">Sistema Web</text>
  <g class="actor-line">
    <path d="M178 468L550 200"/><path d="M178 468L550 350"/>
    <path d="M178 468L550 500"/><path d="M178 468L550 650"/>
    <path d="M178 468L550 800"/>
    <path d="M1322 648H1050"/>
  </g>
  <g>
    <ellipse class="usecase maincase" cx="800" cy="200" rx="250" ry="50"/><text class="label" x="800" y="206">Registrar asistencia y tardanzas</text>
    <ellipse class="usecase" cx="800" cy="350" rx="250" ry="50"/><text class="label" x="800" y="356">Registrar retiro anticipado y rectificaciones</text>
    <ellipse class="usecase" cx="800" cy="500" rx="250" ry="50"/><text class="label" x="800" y="506">Consultar alertas de faltas (3, 5, 10 y 20)</text>
    <ellipse class="usecase" cx="800" cy="650" rx="250" ry="50"/><text class="label" x="800" y="656">Gestionar actas precompletadas (10 y 20)</text>
    <ellipse class="usecase" cx="800" cy="800" rx="250" ry="50"/><text class="label" x="800" y="806">Rectificar o justificar dentro de 48 h hábiles</text>
  </g>
  <g transform="translate(155 430)"><circle class="actor-line" cx="0" cy="0" r="18"/><path class="actor-line" d="M0 18V68M-28 38H28M0 68L-24 104M0 68L24 104"/><text class="actor-name" x="0" y="132">Preceptoría</text></g>
  <g transform="translate(1340 610)"><circle class="actor-line" cx="0" cy="0" r="18"/><path class="actor-line" d="M0 18V68M-28 38H28M0 68L-24 104M0 68L24 104"/><text class="actor-name" x="0" y="132">Dirección</text></g>
  <text class="note" x="325" y="955">El sistema calcula faltas y genera alertas/actas; Preceptoría revisa y gestiona el seguimiento, con auditoría de rectificaciones.</text>
</svg>
