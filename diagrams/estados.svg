<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Diagrama UML B&N — ProA La Falda: estados -->
        <svg width="1750" height="590" id="umlDiagramSvg" xmlns="http://www.w3.org/2000/svg" viewBox="20 40 1750 590">
          <defs>
            <marker id="umlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000" /></marker>
          </defs>
          <g id="transitionsLayer">
            <g class="transition-item"><path id="path-init-reg" class="transition-path" d="M 72 195 L 160 195" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#umlArrow)" /><rect x="76" y="152" width="76" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8" /><text x="114" y="168" font-family="'Fira Code', monospace" font-size="9" font-weight="600" fill="#000000" text-anchor="middle">matricular()</text></g>
            <g class="transition-item"><path id="path-reg-alert" class="transition-path" d="M 410 195 L 760 195" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#umlArrow)" /><g transform="translate(455, 142)"><rect x="0" y="0" width="260" height="38" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="130" y="15" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#000000" text-anchor="middle">asentarInasistencia()</text><text x="130" y="29" font-family="'Fira Code', monospace" font-size="8.2" fill="#000000" text-anchor="middle">[faltas == 3] / notificarPreceptoríaYDirección()</text></g></g>
            <g class="transition-item"><path id="path-alert-five" class="transition-path" d="M 850 120 C 850 82 920 82 920 120" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#umlArrow)"/><text x="885" y="76" font-family="'Fira Code', monospace" font-size="8.2" font-weight="600" fill="#000000" text-anchor="middle">[5] / notificarPreceptoríaYDirección()</text></g>
            <g class="transition-item"><path id="path-alert-crit" class="transition-path" d="M 1010 195 L 1360 195" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#umlArrow)" /><g transform="translate(1045, 134)"><rect x="0" y="0" width="280" height="48" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="140" y="14" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#000000" text-anchor="middle">asentarInasistencia()</text><text x="140" y="28" font-family="'Fira Code', monospace" font-size="8.2" fill="#000000" text-anchor="middle">[faltas == 10] / notificar ambos</text><text x="140" y="41" font-family="'Fira Code', monospace" font-size="8.2" fill="#000000" text-anchor="middle">y precompletar Acta</text></g></g>
            <g class="transition-item"><path id="path-critical-twenty" class="transition-path" d="M 1435 120 C 1435 82 1505 82 1505 120" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#umlArrow)"/><text x="1470" y="76" font-family="'Fira Code', monospace" font-size="8.2" font-weight="600" fill="#000000" text-anchor="middle">[20] / notificar ambos; precompletar acta</text></g>
            <g class="transition-item"><path id="path-crit-tea" class="transition-path" d="M 1495 270 L 1495 360 L 1180 360 L 1180 450" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#umlArrow)" /><g transform="translate(1215, 326)"><rect x="0" y="0" width="250" height="38" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="125" y="15" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#000000" text-anchor="middle">asentarInasistencia() [faltas ≥ 25]</text><text x="125" y="29" font-family="'Fira Code', monospace" font-size="9" fill="#000000" text-anchor="middle">/ registrarPaseTEA()</text></g></g>
          </g>
          <g id="nodesLayer">
            <g id="node-initial" class="state-card" transform="translate(60, 195)"><circle cx="0" cy="0" r="12" fill="#000000" stroke="#000000" stroke-width="1"/><text x="0" y="26" font-family="'Inter', sans-serif" font-weight="600" font-size="9.5" fill="#000000" text-anchor="middle">Inicial</text></g>
            <g id="node-regular" class="state-card" transform="translate(160, 120)" data-state-id="regular"><rect class="state-outline" width="250" height="150" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="36" x2="250" y2="36" stroke="#000000" stroke-width="1.2" /><text x="125" y="23" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#000000" text-anchor="middle">Regular</text><g transform="translate(14, 58)"><text x="0" y="0" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#000000">do / computarPresentismo-Diario()</text><text x="0" y="44" font-family="'Inter', sans-serif" font-size="9.5" fill="#000000">• Cursado normal activo</text></g></g>
            <g id="node-alert" class="state-card" transform="translate(760, 120)" data-state-id="alert"><rect class="state-outline" width="250" height="150" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="36" x2="250" y2="36" stroke="#000000" stroke-width="1.2" /><text x="125" y="23" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#000000" text-anchor="middle">En Alerta Preventiva</text><g transform="translate(14, 58)"><text x="0" y="0" font-family="'Fira Code', monospace" font-size="8.7" font-weight="600" fill="#000000">entry / notificarPreceptoríaYDirección()</text><text x="0" y="44" font-family="'Inter', sans-serif" font-size="9.5" fill="#000000">• Hito 3: emitir alerta</text><text x="0" y="60" font-family="'Inter', sans-serif" font-size="9.5" fill="#000000">• Hito 5: nueva notificación</text><text x="0" y="78" font-family="'Inter', sans-serif" font-size="9.2" fill="#000000">• Preceptoría revisa el aviso</text></g></g>
            <g id="node-critical" class="state-card" transform="translate(1360, 120)" data-state-id="critical"><rect class="state-outline" width="270" height="150" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="36" x2="270" y2="36" stroke="#000000" stroke-width="1.2" /><text x="135" y="23" font-family="'Inter', sans-serif" font-weight="700" font-size="11.5" fill="#000000" text-anchor="middle">En Riesgo Crítico (Acta)</text><g transform="translate(14, 58)"><text x="0" y="0" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#000000">entry / precompletarActa()</text><text x="0" y="44" font-family="'Inter', sans-serif" font-size="9.2" fill="#000000">• Hito 10: alerta y acta</text><text x="0" y="60" font-family="'Inter', sans-serif" font-size="9.2" fill="#000000">• Hito 20: nueva alerta y acta</text><text x="0" y="78" font-family="'Inter', sans-serif" font-size="9" fill="#000000">• Preceptoría gestiona seguimiento</text></g></g>
            <g id="node-tea" class="state-card" transform="translate(1040, 450)" data-state-id="tea"><rect class="state-outline" width="280" height="150" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><line x1="0" y1="36" x2="280" y2="36" stroke="#000000" stroke-width="1.2" /><text x="140" y="23" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#000000" text-anchor="middle">Trayectoria Escolar Asistida (TEA)</text><g transform="translate(14, 58)"><text x="0" y="0" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#000000">entry / derivar-CoordinacionPedagogica()</text><text x="0" y="44" font-family="'Inter', sans-serif" font-size="9.5" fill="#000000">• ≥ 25 faltas (Res. Min. 190/18)</text><text x="0" y="60" font-family="'Inter', sans-serif" font-size="9.5" fill="#000000">• Pérdida de cursado tradicional</text></g></g>
            <text x="1000" y="620" font-family="'Inter', sans-serif" font-size="10" fill="#000000" text-anchor="middle">TEA no tiene salida automática; cualquier reconfiguración requiere aprobación institucional e inspección.</text>
          </g>
        </svg>
