    <ellipse class="usecase" cx="800" cy="430" rx="250" ry="58"/><text class="label" x="800" y="436">Crear tareas y definir fechas límite</text>
    <ellipse class="usecase" cx="800" cy="615" rx="250" ry="58"/><text class="label" x="800" y="621">Revisar entregas recibidas, pendientes y atrasadas</text>
