<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">CU-02 Gestionar bitacora, tareas, entregas y evaluaciones</title>
  <desc id="desc">Casos de uso del docente: registrar bitacora, crear tareas, revisar entregas y cargar calificaciones formativas.</desc>
  <defs><style>text{font-family:Inter,Arial,sans-serif;fill:#000}.heading{font-size:26px;font-weight:700}.subheading{font-size:15px}.system,.usecase,.maincase{fill:#fff;stroke:#000;stroke-width:2}.label{font-size:16px;font-weight:600;text-anchor:middle}.actor-line{fill:none;stroke:#000;stroke-width:2}.actor-name{font-size:17px;font-weight:600;text-anchor:middle}.note{font-size:14px}</style></defs>
  <rect width="1400" height="1000" fill="#fff"/><text class="heading" x="700" y="45" text-anchor="middle">CU-02 · Gestionar bitácora, tareas y evaluaciones</text>
  <text class="subheading" x="700" y="72" text-anchor="middle">Actor principal: Docente · precondición: autenticado y asignado al espacio curricular</text>
  <rect class="system" x="300" y="105" width="1010" height="820" rx="8"/><text x="325" y="138" font-size="15" font-weight="700">Sistema Web</text>
  <g class="actor-line">
    <path d="M178 468L550 245"/><path d="M178 468L550 430"/>
    <path d="M178 468L550 615"/><path d="M178 468L550 800"/>
  </g>
  <g>
